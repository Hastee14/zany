<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Us</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Fraunces:opsz,wght@9..144,300..700&family=Caveat:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=44" />
  </head>

  <body>

    <canvas id="hearts-canvas" aria-hidden="true"></canvas>

    <button id="music-toggle" type="button" aria-label="Toggle music" hidden>
      <span id="music-icon">&#9834;</span>
    </button>

    <!-- ===================== 0. The shelf ===================== -->
    <section id="scene-shelf" class="scene is-active">
      <div class="shelf">
        <p class="shelf-title" id="shelf-title"></p>
        <p class="shelf-hint" id="shelf-hint"></p>
        <div class="shelf-cards" id="shelf-cards"></div>
      </div>
    </section>

    <!-- ===================== 1. The lock ===================== -->
    <section id="scene-lock" class="scene">
      <button class="shelf-back" id="lock-back" type="button">&#8592; back</button>
      <div class="lock-card" id="lock-card">
        <p class="occasion" id="occasion-label"></p>
        <img src="envelope.png" alt="" id="envelope" />
        <p class="lock-title" id="lock-title"></p>
        <p class="lock-hint" id="lock-hint"></p>

        <div class="pin-dots" id="pin-dots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>

        <div class="keypad" id="keypad">
          <button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button><button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button><button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button><span class="key key--blank" aria-hidden="true"></span><button class="key" type="button" data-key="0">0</button><button class="key key--del" type="button" data-key="del" aria-label="Delete">&#9003;</button>
        </div>

        <p class="lock-error" id="lock-error" hidden></p>
      </div>
    </section>

    <!-- ===================== 3. The page ===================== -->
    <section id="scene-letterpage" class="scene">
      <div class="page">

        <header class="hero">
          <p class="hero-kicker" id="hero-kicker"></p>
          <h1 class="page-title" id="page-title"></h1>
          <div class="photo-frame photo-frame--lg">
            <img id="her-photo" alt="" />
            <span class="photo-missing" id="her-missing" hidden></span>
          </div>
          <p class="photo-caption" id="her-caption"></p>
        </header>

        <article class="letter-paper reveal" id="sec-letter">
          <div id="letter-body"></div>
          <p class="signoff" id="signoff"></p>
        </article>

        <section class="sec" id="sec-gallery" hidden>
          <h2 class="sec-title reveal" id="gallery-title"></h2>
          <div class="gallery" id="gallery-grid"></div>
        </section>

        <section class="sec" id="sec-videos" hidden>
          <h2 class="sec-title reveal" id="videos-title"></h2>
          <div class="videos" id="videos-grid"></div>
        </section>

        <section class="sec" id="sec-reasons" hidden>
          <h2 class="sec-title reveal" id="reasons-title"></h2>
          <ol class="reasons" id="reasons-list"></ol>
        </section>

        <section class="sec" id="sec-counter" hidden>
          <h2 class="sec-title reveal" id="counter-title"></h2>
          <div class="counter reveal" id="counter"></div>
          <p class="counter-since reveal" id="counter-since"></p>
        </section>

        <section class="sec" id="sec-nicknames" hidden>
          <h2 class="sec-title reveal" id="nicknames-title"></h2>
          <p class="nicks-hint reveal" id="nicknames-hint"></p>
          <div class="nicks" id="nicks-grid"></div>
        </section>

        <section class="sec sec-ask" id="sec-ask" hidden>
          <button class="ask-card reveal" id="ask-card" type="button">
            <span class="ask-card-label" id="ask-card-label"></span>
            <span class="ask-card-sub" id="ask-card-sub"></span>
          </button>

          <div class="ask-body" id="ask-body" hidden>
          <div class="photo-frame photo-frame--ask">
            <img id="us-photo" alt="Us" />
            <span class="photo-missing" id="us-missing" hidden></span>
          </div>
          <p class="ask-kicker" id="ask-kicker"></p>
          <h2 class="ask-lead" id="ask-lead"></h2>
          <p class="ask-question" id="ask-question"></p>
          <p class="ask-shy" id="ask-shy"></p>
          <div class="ask-buttons">
            <img src="yes.png" class="btn yes-btn" id="yes-btn" alt="Yes" />
            <span class="no-slot"><img src="no.png" class="btn no-btn" id="no-btn" alt="No" /></span>
          </div>
          </div>
        </section>

        <section class="sec" id="sec-answered" hidden>
          <h2 class="answered-title" id="yes-title"></h2>
          <p class="answered-sub" id="yes-subtitle"></p>
        </section>

        <section class="sec" id="sec-closing" hidden>
          <p class="closing" id="closing-text"></p>
        </section>
      </div>
    </section>

    <!-- ===================== 4. Month two ===================== -->
    <section id="scene-month2" class="scene">
      <div class="m2-page">
        <header class="m2-hero">
          <span class="m2-sun" aria-hidden="true"></span>
          <p class="m2-kicker" id="m2-kicker"></p>
          <h1 class="m2-title" id="m2-title"></h1>
        </header>

        <article class="m2-paper" id="m2-letter">
          <div id="m2-body"></div>
          <p class="m2-signoff" id="m2-signoff"></p>
        </article>

        <figure class="m2-figure">
          <div class="m2-photo">
            <img id="m2-photo-img" alt="" />
            <span class="photo-missing" id="m2-missing" hidden></span>
          </div>
          <figcaption class="m2-caption" id="m2-caption"></figcaption>
        </figure>

        <p class="m2-closing" id="m2-closing"></p>
      </div>
    </section>

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <audio id="song" loop preload="auto"></audio>
    <script src="script.js?v=44"></script>
  </body>
</html>
